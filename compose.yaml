name: readbox
services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: mailstack_dev
      POSTGRES_USER: mailstack
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailstack -d mailstack_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
