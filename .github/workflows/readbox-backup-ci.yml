name: ReadBox BR03 dependency lock generation in disposable CI
on:
  push:
    branches: [maintenance/readbox-br03-20261118]
permissions:
  contents: read
jobs:
  generate-lock:
    if: github.repository == 'JILLU-Games/ReadBox'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exact hashed SDK lock for Ubuntu/Python 3.12
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'pip==25.3' 'pip-tools==7.5.3'
          printf 'boto3==1.44.4\ncryptography==50.0.2\n' > /tmp/br03-input.in
          pip-compile --generate-hashes --allow-unsafe --no-header --no-annotate --output-file /tmp/br03-lock.txt /tmp/br03-input.in
          echo BR03_HASH_LOCK_START
          cat /tmp/br03-lock.txt
          echo BR03_HASH_LOCK_END
