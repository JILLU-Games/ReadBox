name: ReadBox SEO-01 scoped disposable CI (no deployment)
on:
  push:
    branches: [implementation/readbox-seo01-20261120]
    paths:
      - 'src/core/seo/**'
      - 'src/app/(workspace)/vcon/settings/page.tsx'
      - 'src/app/(workspace)/vcon/settings/seo-actions.ts'
      - 'src/components/vcon/seo-settings-console.tsx'
      - 'src/app/page.tsx'
      - 'src/app/contact/page.tsx'
      - 'src/app/privacy/page.tsx'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/20261120000000_seo01_site_seo_settings/**'
      - 'tests/seo/**'
      - 'tests/ui/seo-settings.test.tsx'
      - 'tests/admin/phase6-settings-update-health.test.ts'
      - '.github/workflows/seo01-disposable-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo01:
    if: github.repository == 'vibtoolshq/ReadBox'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Frozen source ancestry and exact file allowlist
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8e5b01b65c6f451dbbfabef64ca429687592e455 HEAD
          git diff --check 8e5b01b65c6f451dbbfabef64ca429687592e455 HEAD
          python3 - <<'PY'
          import subprocess
          base="8e5b01b65c6f451dbbfabef64ca429687592e455"
          allowed={
            "prisma/schema.prisma",
            "prisma/migrations/20261120000000_seo01_site_seo_settings/migration.sql",
            "src/core/seo/types.ts","src/core/seo/validation.ts",
            "src/core/seo/service.ts","src/core/seo/metadata.ts",
            "src/app/(workspace)/vcon/settings/seo-actions.ts",
            "src/components/vcon/seo-settings-console.tsx",
            "src/app/(workspace)/vcon/settings/page.tsx",
            "src/app/page.tsx","src/app/contact/page.tsx","src/app/privacy/page.tsx",
            "tests/seo/seo-settings.test.ts","tests/seo/page-metadata.test.ts",
            "tests/ui/seo-settings.test.tsx","tests/admin/phase6-settings-update-health.test.ts",
            ".github/workflows/seo01-disposable-ci.yml",
          }
          changed=set(subprocess.check_output(["git","diff","--name-only",base,"HEAD"],text=True).splitlines())
          assert changed <= allowed | {p for p in changed if p.startswith("notes/seo-discovery/")}, sorted(changed-allowed)
          assert all(not p.startswith(("src/core/auth/","src/core/dns/","src/core/mailboxes/","reference/","deployment/")) for p in changed)
          assert subprocess.check_output(["git","diff","--name-only",base,"--","prisma/migrations"],text=True).strip()=="prisma/migrations/20261120000000_seo01_site_seo_settings/migration.sql"
          print("SEO01_EXACT_SCOPE_PASS",len(changed))
          PY
      - name: Locked Node dependencies and schema validation
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run db:validate
      - name: SEO focused security, metadata, admin and UI regression
        shell: bash
        run: |
          set -euo pipefail
          node --conditions=react-server --import tsx --test tests/seo/seo-settings.test.ts tests/seo/page-metadata.test.ts
          npx vitest run --config vitest.config.mts             tests/ui/seo-settings.test.tsx tests/ui/vcon-phase6.test.tsx
          npx eslint src/core/seo src/components/vcon/seo-settings-console.tsx             'src/app/(workspace)/vcon/settings/page.tsx'             'src/app/(workspace)/vcon/settings/seo-actions.ts'             src/app/page.tsx src/app/contact/page.tsx src/app/privacy/page.tsx             tests/seo tests/ui/seo-settings.test.tsx
          npm run typecheck
          npm run build
          echo SEO01_FOCUSED_REGRESSION_AND_BUILD_PASS
          # Unchanged readiness regression runs last; the new additive migration
          # may require a fixture update outside SEO-01's allowlist.
          # A failure remains BLOCKED rather than silently marking it PASS.
          node --conditions=react-server --import tsx --test tests/admin/phase6-settings-update-health.test.ts
      - name: Confirm NO production deployment or release
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = vibtoolshq/ReadBox
          echo SEO01_CI_ONLY_NO_DEPLOYMENT_PASS
