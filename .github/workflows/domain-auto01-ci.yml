name: ReadBox DOMAIN-AUTO-01 — disposable verification
on:
  push:
    branches: [main]
    paths:
      - "src/core/dns/**"
      - "src/core/backup/agent-client.ts"
      - "src/core/backup/validation.ts"
      - "src/app/(workspace)/vcon/domains/actions.ts"
      - "src/app/api/vcon/domains/**"
      - "src/components/vcon/domain-form.tsx"
      - "deployment/backup-agent/agent.py"
      - "tests/dns/**"
      - ".github/workflows/domain-auto01-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable:
    if: github.repository == 'vibtoolshq/ReadBox'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact Scope Lock and secret isolation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          python3 - <<'PY'
          import subprocess
          base = "952516a2cac27649824bf14329f511eae6ae9294"
          subprocess.run(["git", "merge-base", "--is-ancestor", base, "HEAD"], check=True)
          paths = set(subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          exact = {
              "src/core/domains/service.ts",
              "src/app/(workspace)/vcon/domains/actions.ts",
              "src/app/api/vcon/domains/[uuid]/dkim/route.ts",
              "src/components/vcon/domain-form.tsx",
              "deployment/backup-agent/agent.py",
              "src/core/backup/agent-client.ts",
              "src/core/backup/validation.ts",
              ".github/workflows/domain-auto01-ci.yml",
              "docs/DOMAIN-AUTOMATION.md",
          }
          allow = exact | {
              "notes/003-PHASE-PROGRESS-AND-CHANGE-LOG.md",
              "notes/004-ERROR-HANDLING-INVENTORY.md",
              "notes/005-ACTUAL-IMPLEMENTATION-TRACKER.md",
              "notes/006-VERIFICATION-AND-RELEASE-GATES.md",
          }
          assert all(p in allow or p.startswith("src/core/dns/") or
                     p.startswith("tests/dns/") for p in paths), sorted(paths)
          assert "deployment/backup-agent/agent.py" in paths
          assert "src/core/dns/cloudflare-auto.ts" in paths
          assert "src/core/dns/domain-automation.ts" in paths
          subprocess.run(["git", "diff", "--check", base, "HEAD"], check=True)
          print("DOMAIN_AUTO01_EXACT_SCOPE_PASS", len(paths))
          PY
      - name: Install pinned Node dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: One focused type, DNS and host-broker verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx prisma generate
          npm run typecheck
          node --conditions=react-server --import tsx --test \
            tests/dns/domain-automation.test.ts \
            tests/dns/dkim-provision.test.ts
          PYTHONDONTWRITEBYTECODE=1 python3 tests/dns/test_domain_host_bridge.py
          echo DOMAIN_AUTO01_FOCUSED_DISPOSABLE_PASS
      - name: No live secrets, DNS write, VPS deployment or release
        run: echo DOMAIN_AUTO01_SOURCE_ONLY_NO_LIVE_DNS_OR_VPS
