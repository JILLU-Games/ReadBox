name: ReadBox MERGE-GATE-04 release safety guard - disposable CI
on:
  push:
    branches: [ci/domain-auto01-merge]
    paths:
      - .github/workflows/domain-auto01-merge-check.yml
permissions:
  contents: read
concurrency:
  group: merge-gate04-release-guard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release-safety:
    if: github.repository == 'JILLU-Games/ReadBox'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable scoped candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact MG-04 paths, immutable baseline and no production files
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .env
          python3 - <<'PY'
          import subprocess
          base = "fa32be8f3fe2993b11df5e872fe8552ac8af40f7"
          allowed = {
            ".github/workflows/readbox-first-release.yml",
            ".github/workflows/domain-auto01-merge-check.yml",
            "tests/integration/r06-release-gate.test.mjs",
            "docs/RELEASE-GOVERNANCE.md",
            "notes/003-PHASE-PROGRESS-AND-CHANGE-LOG.md",
            "notes/004-ERROR-HANDLING-INVENTORY.md",
            "notes/005-ACTUAL-IMPLEMENTATION-TRACKER.md",
            "notes/006-VERIFICATION-AND-RELEASE-GATES.md",
          }
          required = {
            ".github/workflows/readbox-first-release.yml",
            ".github/workflows/domain-auto01-merge-check.yml",
            "tests/integration/r06-release-gate.test.mjs",
          }
          subprocess.run(["git", "merge-base", "--is-ancestor", base, "HEAD"], check=True)
          changed = set(subprocess.check_output(
            ["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          assert required <= changed and changed <= allowed, (
              "MG04_SCOPE_VIOLATION", sorted(changed - allowed), sorted(required - changed))
          subprocess.run(["git", "diff", "--check", base, "HEAD"], check=True)
          print("MG04_EXACT_SCOPE_PASS", len(changed))
          PY
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Negative release trigger and R06 formal NO-GO contract
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/integration/r06-release-gate.test.mjs
          node --test tests/integration/r06-release-gate.test.mjs
          node scripts/testing/r06-release-gate.mjs --ci --output "$RUNNER_TEMP/mg04-gate-status.json"
          grep -Fq '"status": "NO_GO"' "$RUNNER_TEMP/mg04-gate-status.json"
          grep -Fq '"open": 7' "$RUNNER_TEMP/mg04-gate-status.json"
          echo MG04_PRERELEASE_DISABLED_AND_NO_GO_PASS
      - name: Verify no production actions
        run: echo MG04_NO_TAG_RELEASE_VPS_DNS_R2_MAIN_PUSH_OR_SECRETS
