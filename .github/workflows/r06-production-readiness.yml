name: ReadBox R06 production readiness - CI only, NO release
on:
  push:
    branches:
      - main
      - maintenance/readbox-r06-20261117
  pull_request:
    branches: [main]
  workflow_dispatch:

# No write, deployment, package, secrets, tags, releases or live VPS credentials.
permissions:
  contents: read

concurrency:
  group: r06-readonly-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consolidated-acceptance:
    if: github.repository == 'JILLU-Games/ReadBox'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact immutable CI candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node 22 from locked app toolchain
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Consolidated source, R06 negative gates and regression
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          npm run db:validate
          # R-04 introduced two pre-existing unused catch bindings in a source\n          # outside R-06 Scope Lock; track exact two, never hide new lint errors.\n          npm run lint -- --ignore-pattern src/core/setup/trusted-operations.ts\n          node scripts/testing/r06-verify-lint-baseline.mjs\n          npm run typecheck
          npm run test:unit
          env -u DATABASE_URL npm run test:ui
          node --test tests/operations/r05-contract.test.mjs tests/integration/r06-release-gate.test.mjs
          npm run build
          echo "R06_APP_UI_AUTH_PROVENANCE_AND_NEGATIVE_GATES_PASS"

      - name: Current production dependency advisories - release blocker if unsafe
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=moderate
          echo "R06_DEPENDENCY_AUDIT_PASS"

      - name: Verified ephemeral PostgreSQL 16, migration replay and auth tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/testing/r06-ephemeral-postgres.sh

      - name: Isolated Docker image boot, loopback SMTP to private LMTP and Maildir
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/testing/r06-smtp-rehearsal.sh
          echo "R06_ISOLATED_PRODUCTION_IMAGES_SMTP_LMTP_PASS"

      - name: Disposable named volumes, encrypted backup, ACL restore and after-DB-apply rollback
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq age acl
          bash deployment/operations/tests/r05-rehearsal.sh
          echo "R06_ENCRYPTED_BACKUP_RESTORE_ROLLBACK_PASS"

      - name: Immutable R06 and QIS01 separate Scope Locks, no deployment/release, NO-GO
        shell: bash
        run: |
          set -euo pipefail
          # Do NOT compare the R05 base to moving HEAD: a later, separately
          # authorized QIS01 implementation must not re-open R06's frozen scope.
          # Verify four immutable phase-specific Git ranges independently.
          python3 - <<'PY'
          import subprocess

          R05 = "c3f9dd4d146dfb28a3d23139ce0fafb3e333acca"
          R06 = "807ca9f38adb02db2a8b73dc0901fce23ee5e63a"
          R06_CLOSED = "fa774bd436bf19c35f1cc7d4ad8dfb74a288436a"
          QIS01 = "2833f1f1e1be76d501cdd3fa2210d0c1084d9b47"
          QIS01_CLOSED = "4467636a1300fd45b85b35cf556fdb106faa0ec9"

          def git(*args):
              return subprocess.check_output(("git", *args), text=True).strip()

          def check_range(label, base, head, files):
              expected = set(files.splitlines())
              actual = set(git("diff", "--name-only", base, head).splitlines())
              if actual != expected:
                  raise SystemExit(f"{label}_FAIL unexpected/missing files: {sorted(actual ^ expected)}")
              subprocess.run(("git", "diff", "--check", base, head), check=True)
              print(f"{label}_PASS {len(expected)}")

          for sha in (R05, R06, R06_CLOSED, QIS01, QIS01_CLOSED):
              subprocess.run(("git", "merge-base", "--is-ancestor", sha, "HEAD"), check=True)

          check_range("R06_HISTORICAL_IMPLEMENTATION_SCOPE", R05, R06, """
          .github/workflows/r06-production-readiness.yml
          README.md
          SECURITY.md
          docs/PRODUCTION-ACCEPTANCE-RUNBOOK.md
          docs/RELEASE-GOVERNANCE.md
          docs/THIRD-PARTY-PROVENANCE.md
          scripts/testing/r06-ephemeral-postgres.sh
          scripts/testing/r06-release-gate.mjs
          scripts/testing/r06-smtp-rehearsal.sh
          scripts/testing/r06-verify-lint-baseline.mjs
          tests/integration/r06-release-gate.test.mjs
          """.strip().replace("          ", ""))

          check_range("R06_HISTORICAL_NOTES_SCOPE", R06, R06_CLOSED, """
          notes/001-PRODUCTION-RELEASE-BLOCKERS.md
          notes/002-PRODUCTION-PHASE-ROADMAP.md
          notes/003-PHASE-PROGRESS-AND-CHANGE-LOG.md
          notes/004-ERROR-HANDLING-INVENTORY.md
          notes/005-ACTUAL-IMPLEMENTATION-TRACKER.md
          notes/006-VERIFICATION-AND-RELEASE-GATES.md
          notes/007-VPS-MAILSERVER-CONTRACTS.md
          notes/014-R06-PATCH-AUDIT.md
          """.strip().replace("          ", ""))

          check_range("QIS01_APPROVED_IMPLEMENTATION_SCOPE", R06_CLOSED, QIS01, """
          .env.example
          .github/workflows/qis01-ci.yml
          README.md
          SECURITY.md
          docker-compose.yml
          docs/QUICK-INSTALL-AND-FIRST-ADMIN.md
          scripts/install/readbox-install.sh
          scripts/install/readbox-update.sh
          src/app/initial-setup/actions.ts
          src/app/initial-setup/page.tsx
          src/components/setup/first-admin-form.tsx
          src/core/setup/first-admin-activation.ts
          tests/integration/quick-install-compose.test.mjs
          tests/setup/first-admin-web.test.ts
          tests/setup/quick-install.test.ts
          tests/ui/first-admin-onboarding.test.tsx
          """.strip().replace("          ", ""))

          check_range("QIS01_APPROVED_NOTES_SCOPE", QIS01, QIS01_CLOSED, """
          notes/003-PHASE-PROGRESS-AND-CHANGE-LOG.md
          notes/006-VERIFICATION-AND-RELEASE-GATES.md
          notes/015-QIS01-PATCH-AUDIT.md
          """.strip().replace("          ", ""))

          print("R06_QIS01_IMMUTABLE_SCOPE_AUDITS_PASS")
          PY
          # Formal release governance is unchanged and MUST remain NO-GO.
          node scripts/testing/r06-release-gate.mjs --ci --output "$RUNNER_TEMP/r06-sanitized-gate-result.json"
          grep -Fq '"status": "NO_GO"' "$RUNNER_TEMP/r06-sanitized-gate-result.json"
          grep -Fq '"open": 7' "$RUNNER_TEMP/r06-sanitized-gate-result.json"
          echo "R06_ALL_CI_CONTRACTS_PASS_PRODUCTION_NO_GO"

      - name: Upload strictly sanitized non-production gate status
        uses: actions/upload-artifact@v4
        with:
          name: r06-ci-no-go-${{ github.sha }}
          path: ${{ runner.temp }}/r06-sanitized-gate-result.json
          retention-days: 7
          if-no-files-found: error
