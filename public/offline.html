<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f6f8">
    <title>MailStack offline</title>
    <style>
      :root { color-scheme: light dark; font-family: "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6f8; color: #172733; }
      main { width: min(100% - 2rem, 28rem); padding: 1.5rem; border: 1px solid #d9e1e6; border-radius: 0.5rem; background: #fff; }
      h1 { margin: 0 0 0.5rem; font-size: 1.2rem; }
      p { margin: 0; color: #647783; line-height: 1.5; }
      @media (prefers-color-scheme: dark) { body { background: #111a21; color: #e4edf1; } main { background: #18242d; border-color: #34444f; } p { color: #a2b2bb; } }
    </style>
  </head>
  <body>
    <main>
      <h1>MailStack is offline</h1>
      <p>Reconnect to the network to access your workspace. Mailbox content is not available offline.</p>
    </main>
  </body>
</html>
